<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  var saved = localStorage.getItem('shortsbox_theme');
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>쇼츠박스 — 여행 꿀템 쇼츠 큐레이션</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pagestyles.css">
</head>
<body data-page="home">

<header id="site-header" class="site-header"></header>

<main>
  <!-- 히어로 -->
  <section class="section hero">
    <div class="container hero-inner">
      <span class="hero-badge" id="hero-badge">여행 꿀템 쇼츠 모음</span>
      <h1>유튜브에서 본 여행 꿀템<br><span class="grad-text">또 까먹으셨나요?</span></h1>
      <p class="sub hero-desc">여행지별로 꿀템 쇼츠 TOP10과 구매처를 모아봤어요. 가입 없이 바로 둘러보세요.</p>
      <div class="hero-actions">
        <a href="explore.html" class="btn btn-gradient">여행지 둘러보기</a>
      </div>
    </div>
  </section>

  <!-- 요즘 뜨는 여행 꿀템 쇼츠 -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="section-head">
        <h2>요즘 뜨는 <span class="grad-text">여행 꿀템 쇼츠</span></h2>
      </div>
      <div class="shorts-grid" id="home-shorts-grid" style="margin-bottom:0"></div>
    </div>
  </section>

  <!-- 광고 -->
  <section class="container ad-slot">
    <span class="ad-slot-label">AD</span>
    <ins class="kakao_ad_area" style="display:none;"
      data-ad-unit="DAN-x83Zj1FkAxgtkkHL"
      data-ad-width="300"
      data-ad-height="250"></ins>
  </section>

  <!-- 인기 여행지 -->
  <section class="section" style="background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
    <div class="container">
      <div class="section-head">
        <h2>인기 여행지</h2>
        <a href="explore.html" class="more-link" id="featured-more-link">전체보기</a>
      </div>
      <div class="card-grid" id="featured-grid"></div>
    </div>
  </section>

  <!-- 저장 기능 안내 배너 -->
  <section class="section">
    <div class="container">
      <div class="gradient-banner">
        <h2>마음에 드는 여행지를 저장해보세요</h2>
        <p>카드의 저장 버튼만 누르면 바로 저장돼요. 회원가입 없이, 이 브라우저에서 바로 확인할 수 있어요.</p>
        <a href="mypage.html" class="btn">저장한 목록 보기</a>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>
<nav id="site-bottomnav" class="bottom-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabase-client.js" defer></script>
<script src="assets/icons.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/nav.js" defer></script>
<script src="js/lightbox.js" defer></script>
<script src="js/home-page.js" defer></script>
<script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
</body>
</html>
