<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  var saved = localStorage.getItem('shortsbox_theme');
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

      <a href="explore.html" class="more-link">여행지 더 보기</a>

    <div class="card-grid" id="saved-destinations"></div>

    <div class="section-head" style="margin-top:var(--space-7)">
      <h2>저장한 꿀템 쇼츠</h2>
    </div>
    <div class="shorts-grid" id="saved-shorts"></div>

    <div class="ad-slot">
