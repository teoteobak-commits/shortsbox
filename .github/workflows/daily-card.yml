name: Daily card news

# 매일 한국시간 08:00 (UTC 23:00) 에 그날 카드뉴스를 만들고 텔레그램으로 보낸다.
#
# 원래 Claude 클라우드 루틴이 하던 일인데, 그 환경은 i.ytimg.com 아웃바운드가 막혀 있고
# 권한 분류기 때문에 흔적 없이 끝나는 실행이 반복됐다(2026-08-10~11 6회 연속 실패).
# Actions 는 네트워크가 열려 있고 실행 로그가 남는다.
#
# 필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# 2026-08-13: 스레드 자동 게시를 걷어냈다. 승인 버튼도, 게시 워크플로우도 없다.
# 스레드도 인스타·X 처럼 멘트만 받아서 사람이 올린다. 이 워크플로우가 하는 일은
# 카드 만들기 + 텔레그램으로 카드와 멘트 6개 보내기, 그게 전부다.
#
# 시크릿이 없으면 카드까지는 만들어 커밋하고 전송만 건너뛴다(작업은 실패로 표시되지 않는다).

on:
  schedule:
    # 정각은 전 세계 예약이 몰려 몇 시간씩 밀린다(정적 페이지 워크플로우에서 실제로 겪었다).
    # 그래서 23:04 로 어중간하게 둔다. 한국시간 08:04.
    - cron: '4 23 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '카드를 새로 만든다(false 면 이미 만들어둔 pending-post.json 을 그대로 전송만 한다)'
        type: boolean
        default: true

permissions:
  contents: write

# 같은 워크플로우가 겹쳐 돌면 push 가 충돌한다. 앞의 것이 끝날 때까지 기다린다.
concurrency:
  group: shortsbox-daily-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # @napi-rs/canvas 가 devDependencies 에 있다. package-lock.json 이 있으니 ci 를 쓴다.
      - name: Install deps
        run: npm ci

      # rebuild=false 로 부르면 만들지 않는다. 손으로 만들어 커밋해둔 카드를 다시 보낼 때 쓴다 —
      # 그냥 다시 돌리면 최근 사용 이력 때문에 또 다른 영상이 뽑혀 카드가 하나 더 생긴다.
      - name: Build today's card
        id: build
        if: ${{ inputs.rebuild != false }}
        run: |
          set -o pipefail
          node scripts/build-daily-post.js | tee /tmp/summary.json
          echo "summary=$(cat /tmp/summary.json)" >> "$GITHUB_OUTPUT"

      # 카드를 저장소에 남겨 공개 URL로도 열리게 한다(텔레그램을 놓쳐도 다시 볼 수 있다).
      - name: Commit card
        if: ${{ inputs.rebuild != false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # card-history.json 이 빠지면 다음 실행이 오늘 쓴 영상을 모르고 또 고른다.
          git add assets/card-news automation/pending-post.json automation/card-history.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            # 카드 파일명과 같은 한국시간 날짜를 쓴다. UTC 로 찍으면 23:04 실행이
            # 만든 08-16 카드가 "카드뉴스 생성 (2026-08-15)" 로 기록돼 나중에
            # git log 를 읽는 사람이 어느 날 카드인지 헷갈린다(실제로 그랬다).
            git commit -m "카드뉴스 생성 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-daily-card.js

      - name: Summary
        if: ${{ inputs.rebuild != false }}
        run: |
          echo "### 오늘 카드뉴스" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 어느 단계든 실패하면 텔레그램으로 알린다. 조용히 실패하는 게 이 프로젝트에서
      # 제일 큰 문제였다 — 며칠 게시가 빠져도 아무도 몰랐다.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ 카드뉴스 생성 워크플로우가 실패했습니다. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
