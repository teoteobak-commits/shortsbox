name: Threads post on approval

# 매시간 돌면서 텔레그램 승인(✔)이 눌렸는지 확인하고, 눌렸으면 스레드에 게시한다.
# 대부분의 실행은 할 일이 없어 바로 끝난다. 그게 정상이다.
#
# 왜 Actions 인가: Claude 클라우드 루틴에서는 Telegram getUpdates(승인 읽기)와
# Threads 발행이 권한 분류기에 막혔다(2026-08-10~11에 사유까지 기록됨).
#
# 필요한 Secrets:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, THREADS_ACCESS_TOKEN
# 없으면 게시하지 않고 pending-post.json 의 last_error 에 사유를 적어 커밋한다.

on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 매일 카드 워크플로우와 같은 파일(pending-post.json)을 쓴다. 겹치면 push 가 충돌한다.
concurrency:
  group: shortsbox-daily-card
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 이 스크립트는 의존성이 없다(Node 20 내장 fetch/FormData 만 쓴다) — npm ci 를 건너뛰어
      # 매시간 도는 작업을 가볍게 유지한다.
      - name: Check approval and post
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          node scripts/threads-post.js | tee /tmp/result.json
          echo "action=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/result.json","utf8")).action)')" >> "$GITHUB_OUTPUT"

      # action 이 none 이면 아무것도 안 바뀌었으니 커밋하지 않는다.
      # 매시간 도는 작업이라 빈 커밋을 쌓으면 히스토리가 지저분해진다.
      - name: Commit result
        if: steps.run.outputs.action != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/pending-post.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "스레드 게시 루틴: ${{ steps.run.outputs.action }} ($(date -u +%Y-%m-%d\ %H:%MZ))"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Summary
        run: |
          echo "결과: \`$(cat /tmp/result.json)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ 스레드 게시 워크플로우가 실패했습니다. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
