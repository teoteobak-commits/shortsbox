name: Curation report

# 매월 1일·15일 한국시간 09시경, 아직 손 안 댄 영상을 찾아 curation-todo.md 를 갱신하고
# 밀린 게 있으면 텔레그램으로 알린다.
#
# 원래 Claude 클라우드 루틴(trig_01Cm7X9Np…)이 하던 일인데, 그 환경은 아웃바운드가
# 허용목록 방식이라 supabase.co 가 403 으로 막힌다. 8/15 단 한 번의 실행이 그것으로
# 실패했고 리포트는 한 번도 만들어진 적이 없다 — 카드뉴스 루틴을 죽인 것과 같은
# 종류의 실패다. Actions 는 네트워크가 열려 있고 실행 로그가 남는다.
# 옮기면서 클라우드 트리거는 비활성화했다(둘 다 돌면 같은 파일을 두 번 쓴다).
#
# 필요한 Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (없으면 전송만 건너뛴다)

on:
  schedule:
    # 정각·30분은 전 세계 예약이 몰려 몇 시간씩 밀린다. 다른 워크플로우(23:04, 04:37)와도
    # 겹치지 않게 둔다. 00:12 UTC = 한국시간 09:12.
    - cron: '12 0 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shortsbox-curation-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 이 스크립트는 의존성이 없다(fetch 는 Node 20 내장). npm ci 를 돌릴 이유가 없다.
      - name: Build report
        id: report
        run: |
          set -o pipefail
          node scripts/curation-report.js | tee /tmp/curation.json
          echo "summary=$(cat /tmp/curation.json)" >> "$GITHUB_OUTPUT"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add curation-todo.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "큐레이션 점검 리포트 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git pull --rebase --autostash || true
            git push
          fi

      # 밀린 게 있을 때만 보낸다. 0 개인 달까지 알리면 알림이 무뎌진다.
      - name: Notify if backlog
        if: ${{ fromJSON(steps.report.outputs.summary).untouched > 0 || fromJSON(steps.report.outputs.summary).product_only > 0 }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.report.outputs.summary }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "텔레그램 시크릿 없음 — 전송 건너뜀"
            exit 0
          fi
          # 제목은 유튜브 API 에서 온 외부 문자열이다. parse_mode 를 지정하지 않아야
          # 마크다운으로 해석돼 깨지지 않는다.
          node -e '
            const s = JSON.parse(process.env.SUMMARY);
            const lines = [
              `📋 큐레이션 점검 (${s.date})`,
              ``,
              `전체 쇼츠 ${s.total}개 중`,
              `· 미처리(제품·문구 둘 다 없음): ${s.untouched}개`,
              `· 제품은 있는데 문구 없음: ${s.product_only}개`,
              ``,
              `조회수 상위:`,
              ...s.top.map(t => `${t.views_man} [${t.slug}] ${t.title.slice(0, 40)}`),
              ``,
              `전체 목록: https://github.com/${process.env.GITHUB_REPOSITORY}/blob/master/curation-todo.md`,
              `대화형 세션에서 /watch 로 같이 큐레이션하면 됩니다.`,
            ];
            require("fs").writeFileSync("/tmp/msg.txt", lines.join("\n"));
          '
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" \
            > /dev/null

      - name: Summary
        run: |
          echo "### 큐레이션 점검" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/curation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 조용히 실패하는 게 이 프로젝트에서 제일 큰 문제였다 — 클라우드 루틴은 8/15에
      # 실패하고도 아무 흔적을 남기지 않았다.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ 큐레이션 점검 워크플로우가 실패했습니다. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
